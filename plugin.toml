id = "bamboowhut.subversion"
name = "Subversion"
version = "0.1.14"
description = "Browse Subversion repositories and manage working copies, commits, history, branches and conflicts in OpenIDEA."
authors = ["BambooWhut"]
license = "Apache-2.0"
categories = ["vcs"]
icon = "icon.svg"
engines.openidea = "^1.15"
wasm = "dist/plugin.wasm"
activation = ["on-view:subversion", "on-command:*", "on-event:file-saved", "on-event:files-changed"]

[capabilities]
required = ["project.read", "project.write", "editor.read", "process:svn", "events", "storage"]
optional = ["clipboard"]

[contributes.settings]
title = "Subversion"
schema = "settings.schema.json"

[[contributes.views]]
id = "subversion"
title = "Subversion"
icon = "icon.svg"
location = "bottom"
header = "none"
web = "web/panel.html"

[[contributes.commands]]
id = "open"
title = "Subversion"
category = "Subversion"

[[contributes.commands]]
id = "refresh"
title = "Refresh Changes"
category = "Subversion"

[[contributes.commands]]
id = "repositories"
title = "Browse Subversion Repositories"
category = "Subversion"

[[contributes.commands]]
id = "update"
title = "Update Project…"
category = "Subversion"

[[contributes.commands]]
id = "commit-project"
title = "Commit Changes…"
category = "Subversion"

